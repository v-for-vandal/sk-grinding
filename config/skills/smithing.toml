# Smithing conversion normalization config (design-v2 §4.4, skills/smithing/design.md).
# Run:  python3 scripts/normalize_conversion.py config/skills/smithing.toml
#
# ALL NUMBERS ARE PLACEHOLDERS except the structure decided in the design:
#   - reference path = jewelry + 3 categories (equal) + steel + orcish + glass, each 0 -> 75;
#   - jewelry 0 -> 75 gives main Smithing 15 -> 35;
#   - the whole path gives main Smithing 15 -> 100;
#   - one k for all material sub-skills, another k for all category sub-skills.

# Main skill XP curve. Vanilla-style; verify Lorerim's Smithing AVIF values (R-1/R-2).
[main]
actor_value    = "Smithing"   # RE::ActorValue::kSmithing; a skill is managed by the DLL only if it has a file here
improve_mult   = 0.25
improve_offset = 300
exponent       = 1.95
start_level    = 15
target_level   = 100

# Default sub-skill XP curve (0..200 scale). Per sub-skill override: curve = { improve_mult = … }
[sub_curve]
improve_mult   = 0.25
improve_offset = 300
exponent       = 1.95

# Conversion rise (design-v2 §4.4.1): g = k · smoothstep(L/T1) · fall(L). Per sub-skill: T1 = …
[conversion]
rise_T1 = 25

# Group budgets: absolute main-level range, or a share of what is left of N.
[budget]
jewelry  = { main_from = 15, main_to = 35 }
category = { share = 0.5 }   # categories vs materials split of the remainder: open question Q-SMI-6
material = { share = 0.5 }

[reference_path]
level   = 75
members = ["jewelry",
           "one-handed-smithing", "heavy-armor-smithing", "light-armor-smithing",
           "steel", "orcish", "glass"]

[dynamics]             # read by the DLL only (impl/decay.md, impl/main-skill-level.md); placeholders
base_mult  = 1.0       # raw XP = raw use points × base_mult (Update.esm UseMult; LoreRim craft points = 0.5 × item value)
decay_rate = 1.0       # sub-skill decay at full rate, levels per active game day (crafting decays slowly)
rust_rate  = 0.5       # r_skill: rust R growth at full rate, levels per active game day (crafting rusts slowly)
pace_sub   = 600       # P_sub: raw XP per active game hour while a sub-skill is practised (Q-DYN-15)
pace_skill = 150       # P_skill: raw XP per active game hour of normal play with the skill (Q-ML-7)

# Optional crafting pace estimate (raw XP before zone multipliers / DR / bucket falloff).
[crafting]
xp_per_unit_material = 60     # raw XP to the material sub-skill per unit of main material
xp_per_unit_category = 20     # × tier, raw XP to the category sub-skill per unit
daily_bucket_raw_xp  = 4000   # Smithing daily bucket (active game time)
material_group = "material"
category_group = "category"

# ---- sub-skills ------------------------------------------------------------------------------
# T = level where conversion has fallen to ~half; w = width of the falloff.
# T1 (optional) overrides [conversion] rise_T1. Open question Q-ML-10: low-T sub-skills (jewelry,
# iron, leather, steel) have T close to T1, so their conversion peak is well below k.
# tier = category-XP weight of the material (skills/smithing/design.md table; to be filled by the user).

[[subskill]]
name = "jewelry"
group = "jewelry"
T = 15
w = 6

# categories: equal among themselves
[[subskill]]
name = "one-handed-smithing"
group = "category"
T = 90
w = 15
[[subskill]]
name = "two-handed-smithing"

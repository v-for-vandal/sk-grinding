# Restoration: conversion normalization + prototype dynamics (design-v2 §4.4, §5.5).
# Run:  python3 scripts/normalize_conversion.py config/skills/restoration.toml
# The DLL reads the same file (impl/main-skill-level.md) and solves k itself.
#
# ALL NUMBERS ARE PLACEHOLDERS (prototype 1). Magic sub-skills (skills/magic/design.md): only the school sub-directions `<school>/<direction>` (group direction); forms and archetypes are shared by all schools (shared.toml, `form/<form>`, `archetype/standard`, k = 0).

[main]                 # vanilla AVIF curve (refs/vanilla-skill-xp.md §2); LoreRim's own AVIF has ImproveOffset 9999
actor_value    = "Restoration"   # RE::ActorValue::kRestoration; a skill is managed by the DLL only if it has a file here
improve_mult   = 2
improve_offset = 0
exponent       = 1.95
start_level    = 15
target_level   = 100

[sub_curve]            # sub-skill XP curve, 0..200 scale (design-v2 §5.1)
improve_mult   = 2
improve_offset = 0
exponent       = 1.95

[conversion]
rise_T1 = 25

[dynamics]             # read by the DLL only (impl/decay.md, impl/main-skill-level.md)
base_mult  = 2.0         # raw XP = raw use points × base_mult (vanilla AVIF UseMult; Q-XP-9)
decay_rate = 2.0        # sub-skill decay at full rate, levels per active game day (Q-DYN-4 (a))
rust_rate  = 1.0        # r_skill: rust R growth at full rate, levels per active game day (Q-ML-8)
pace_sub   = 1500        # P_sub: raw XP per active game hour while a sub-skill is practised (Q-DYN-15)
pace_skill = 800        # P_skill: raw XP per active game hour of normal play with the skill (Q-ML-7)

[budget]
direction = { share = 1.0 }   # forms and the archetype are shared (shared.toml, k = 0)

[reference_path]
level   = 75
members = ["restoration/help", "restoration/wards", "restoration/sun"] # three, as every school (impl/spell-classifier.md)

# ---- sub-skills -------------------------------------------------------------------------------
# school sub-directions (forms and the archetype: shared.toml)
[[subskill]]
name = "restoration/help"
group = "direction"
T = 90
w = 15

[[subskill]]
name = "restoration/wards"
group = "direction"
T = 90
w = 15

[[subskill]]
name = "restoration/sun"
group = "direction"
T = 90
w = 15

[[subskill]]
name = "restoration/poison"
group = "direction"
T = 90
w = 15

[[subskill]]
name = "restoration/other"
group = "direction"
T = 90
w = 15



# School sub-direction of a spell, from the keywords of its costliest effect (impl/spell-classifier.md).
# Keywords by FormKey (Plugin|0xLocalID); FormKeys from the LoreRim research dump (2026-11-11).
# Rules are checked in order; the first rule with any matching keyword wins; no match -> <school>/other.
# Destruction list: proposal of skills/destruction/design.md (Q-DES-1 open).
# Restoration list: decided, skills/restoration/design.md (Q-RES-1).
# Alteration list: decided, skills/alteration/design.md (order matters: weather, geomancy, kinetic, improve).
# A rule may also list `effects` (MGEF FormKeys): the costliest effect is that MGEF -> the rule matches.


# Perk requirements of the Block tree: impl/perk-requirements.md.
# Source: skills/block/perks.md (*Sub-skill requirements* of each perk). Fields: see
# perks/one-handed.toml. BLK-01, BLK-02 and BLK-09 keep their LoreRim requirements.
# `main_level = "drop"`: the worksheet says "replace Block >= N with <formula>".

[aliases]
shield       = ["heavy-shield", "light-shield"]
shield-parry = ["heavy-shield", "light-shield", "parry"]
1h-weapons   = ["1h-*"]      # "1h-* weapon skills" (concept sub-skills do not match)

[[perk]]
handle     = "BLK-03"        # Experienced Blocking
perk       = "079355:Skyrim.esm"
editor_id  = "REQ_Block_ExperiencedBlocking"
requires   = "oneOf(shield-parry) >= 20"
main_level = "drop"          # LoreRim Block >= 20

[[perk]]
handle     = "BLK-04"        # Powerful Bashes
perk       = "058F67:Skyrim.esm"
editor_id  = "REQ_Block_PowerfulBashes"
requires   = "bash >= 25"    # Block >= 25 stays


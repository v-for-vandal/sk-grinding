# Perk requirements of the One-Handed tree: impl/perk-requirements.md.
# Source: skills/weapons/one-handed.perks.md *Weapon-line requirements (decided)* and
# skills/armor/light-armor.perks-ordinator.md (Rushing Tide, Hissing Dragon).
# Per row: handle (worksheet), perk (FormKey), editor_id, requires (formula → one global
# SPO_Req_<handle without '-'>), main_level (new value of the perk's own OneHanded condition,
# or "drop"), has_perk_replace (restored perks: Ordinator parent → LoreRim parent).

[aliases]                    # weapon lines: the sub-skills whose weapons carry the line keyword
sword-line = ["1h-sword", "1h-short-sword", "1h-spear"]   # WeapTypeSword
axe-line   = ["1h-war-axe", "1h-scythe"]                  # WeapTypeWarAxe

[[perk]]
handle     = "1H-05"           # Mace Focus 1
perk       = "05F592:Skyrim.esm"
editor_id  = "REQ_OneHanded_MaceFocus1"
requires   = "1h-mace >= 45"
main_level = 25                # LoreRim OneHanded >= 25

[[perk]]
handle     = "1H-07"           # Sword & Spear Focus 1
perk       = "05F56F:Skyrim.esm"
editor_id  = "REQ_OneHanded_SwordFocus1"
requires   = "oneOf(sword-line) >= 45 OR twoOf(sword-line) >= 35 OR threeOf(sword-line) >= 25"
main_level = 25                # LoreRim OneHanded >= 25

